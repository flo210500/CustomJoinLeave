# CustomJoinLeave Konfiguration
# Platzhalter: %player% = Spielername, %prefix% = LuckPerms Prefix
# Farben: MiniMessage (<red>, <gold>, <#FF5500>, ...) oder Legacy &-Codes (&c, &6, ...)
# Nachricht deaktivieren: Wert auf "none" setzen

default:
  join: "<gray>%prefix%%player% <white>hat den Server betreten."
  leave: "<gray>%prefix%%player% <white>hat den Server verlassen."

groups:
  admin:
    join: "<red>[ADMIN] <white>%prefix%%player% <yellow>hat den Server betreten! Benehmt euch!"
    leave: "<red>[ADMIN] <white>%prefix%%player% <gray>hat den Server verlassen."

  moderator:
    join: "<blue>[MOD] <white>%prefix%%player% <aqua>ist jetzt online!"
    leave: "<blue>[MOD] <white>%prefix%%player% <gray>hat den Server verlassen."

  vip:
    join: "<gold>[VIP] <white>%prefix%%player% <yellow>ist jetzt online!"
    leave: "<gold>[VIP] <white>%prefix%%player% <gray>hat den Server verlassen."
